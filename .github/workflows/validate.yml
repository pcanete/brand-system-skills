name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            skills/brand-dna-scanner/package-lock.json
            skills/reference-scanner/package-lock.json
            skills/reference-to-astro/package-lock.json

      - name: Install Brand DNA validator dependencies
        run: npm ci --prefix skills/brand-dna-scanner

      - name: Install reference scanner validator dependencies
        run: npm ci --prefix skills/reference-scanner

      - name: Install Astro builder validator dependencies
        run: npm ci --prefix skills/reference-to-astro

      - name: Install remaining skill dependencies
        run: |
          npm ci --prefix skills/brand-manual-builder
          npm ci --prefix skills/reference-lab-builder
          npm ci --prefix skills/visual-tuning-kit
          npm ci --prefix skills/wordpress-publisher
          npm ci --prefix skills/elementor-component-spec

      - name: Set up PHP for generated plugins
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: Install browser for existing runtime tests
        run: npx --prefix skills/reference-to-astro playwright install --with-deps chromium

      - name: Validate repository
        run: npm test
