name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skills/*/package-lock.json

      # Every skill with a lockfile has validators the repository check runs.
      # Listing them by hand left three skills without dependencies.
      - name: Install validator dependencies
        run: |
          for lock in skills/*/package-lock.json; do
            npm ci --prefix "$(dirname "$lock")"
          done

      - name: Validate repository
        run: npm test
